# =============================================================================
# Security Audit — GitHub Actions Workflow
# =============================================================================
# Runs on every PR and push to main. Fails the build if critical or high
# NPM vulnerabilities are found, and validates TypeScript compilation.
# =============================================================================

name: Security Audit

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  security-check:
    name: NPM Audit & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # Use npm ci for deterministic builds from package-lock.json
      - name: Install dependencies (locked)
        run: npm ci

      # Run npm audit — fail on critical or high severity vulnerabilities
      - name: Run NPM Security Audit
        run: npm audit --audit-level=high
        continue-on-error: false

      # TypeScript type checking (catches type errors before merge)
      - name: TypeScript Type Check
        run: npm run lint

      # Build validation (ensures the app compiles cleanly)
      - name: Build Validation
        run: npm run build
